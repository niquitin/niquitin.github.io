<div id="dialog-root"></div><script>const LESSONS=[{"id":"be","level":"A1","category":"Foundations","title":"Verb to be","vi":"Động từ to be","formula":"I am · You/We/They are · He/She/It is","explanation":"Dùng am/is/are để nói về nghề nghiệp, trạng thái, đặc điểm và vị trí.","examples":[["She is a teacher.","Cô ấy là giáo viên."],["They are at school.","Họ ở trường."]],"mistake":"She are busy. → She is busy.","tip":"Chú ý chủ ngữ số ít và số nhiều.","questions":[{"id":"be-m1","topic":"be","level":"A1","type":"mcq","question":"My brother ___ a student.","options":["am","is","are"],"correct":1,"explain":"My brother là ngôi thứ ba số ít nên dùng is."},{"id":"be-m2","topic":"be","level":"A1","type":"mcq","question":"We ___ ready for the test.","options":["are","is","am"],"correct":0,"explain":"We đi với are."},{"id":"be-m3","topic":"be","level":"A1","type":"mcq","question":"I ___ not late.","options":["are","am","is"],"correct":1,"explain":"I đi với am."},{"id":"be-m4","topic":"be","level":"A1","type":"mcq","question":"___ your teachers friendly?","options":["Is","Am","Are"],"correct":2,"explain":"Teachers là số nhiều, dùng Are."},{"id":"be-f","topic":"be","level":"A1","type":"fill","question":"Her parents ___ doctors.","correct":"are","explain":"Parents số nhiều đi với are."},{"id":"be-o","topic":"be","level":"A1","type":"order","question":"Put the words in the correct order.","words":["The","classroom","is","quiet","."],"correct":"The classroom is quiet.","explain":"S + be + adjective."},{"id":"be-e","topic":"be","level":"A1","type":"correct","question":"He are happy.","correct":"He is happy.","explain":"He đi với is."}]},{"id":"present","level":"A1","category":"Tenses","title":"Present Simple","vi":"Hiện tại đơn","formula":"S + V(s/es) · Do/Does + S + V?","explanation":"Diễn tả thói quen, lịch trình và sự thật. Với he/she/it, động từ thêm s/es.","examples":[["She works at a hospital.","Cô ấy làm việc tại bệnh viện."],["We study every evening.","Chúng tôi học mỗi tối."]],"mistake":"He work → He works","tip":"Often/usually/every day là dấu hiệu thường gặp.","questions":[{"id":"present-m1","topic":"present","level":"A1","type":"mcq","question":"He ___ English every day.","options":["study","studies","studying"],"correct":1,"explain":"He là số ít nên dùng studies."},{"id":"present-m2","topic":"present","level":"A1","type":"mcq","question":"They ___ to school by bus.","options":["go","goes","going"],"correct":0,"explain":"They dùng động từ nguyên mẫu."},{"id":"present-m3","topic":"present","level":"A1","type":"mcq","question":"The shop ___ at 8 a.m.","options":["open","opening","opens"],"correct":2,"explain":"The shop số ít nên dùng opens."},{"id":"present-m4","topic":"present","level":"A1","type":"mcq","question":"My parents ___ in Long An.","options":["lives","live","living"],"correct":1,"explain":"Parents là chủ ngữ số nhiều."},{"id":"present-f","topic":"present","level":"A1","type":"fill","question":"My sister ___ coffee every morning.","correct":"drinks","explain":"My sister = she → drinks."},{"id":"present-o","topic":"present","level":"A1","type":"order","question":"Put the words in the correct order.","words":["We","have","class","on","Monday","."],"correct":"We have class on Monday.","explain":"S + V + O + time."},{"id":"present-e","topic":"present","level":"A1","type":"correct","question":"She go to work at seven.","correct":"She goes to work at seven.","explain":"She số ít: goes."}]},{"id":"present-negative","level":"A1","category":"Tenses","title":"Present Simple: Questions & Negatives","vi":"Phủ định và câu hỏi ở hiện tại đơn","formula":"S + don't/doesn't + V · Do/Does + S + V?","explanation":"Sau do/does/don’t/doesn’t phải dùng động từ nguyên mẫu.","examples":[["She doesn't drive to work.","Cô ấy không lái xe đi làm."],["Do you study at night?","Bạn học buổi tối phải không?"]],"mistake":"She doesn't likes → She doesn't like","tip":"Không thêm -s lần thứ hai sau does/doesn’t.","questions":[{"id":"present-negative-m1","topic":"present-negative","level":"A1","type":"mcq","question":"She ___ like coffee.","options":["don’t","doesn’t","isn’t"],"correct":1,"explain":"She dùng doesn’t + V."},{"id":"present-negative-m2","topic":"present-negative","level":"A1","type":"mcq","question":"___ he work on Sundays?","options":["Do","Does","Is"],"correct":1,"explain":"Câu hỏi chủ ngữ he dùng Does."},{"id":"present-negative-m3","topic":"present-negative","level":"A1","type":"mcq","question":"I ___ understand the question.","options":["doesn’t","isn’t","don’t"],"correct":2,"explain":"I dùng don’t."},{"id":"present-negative-m4","topic":"present-negative","level":"A1","type":"mcq","question":"Does she ___ here?","options":["lives","live","living"],"correct":1,"explain":"Sau does dùng động từ nguyên mẫu."},{"id":"present-negative-f","topic":"present-negative","level":"A1","type":"fill","question":"___ you speak English?","correct":"Do","explain":"You đi với Do trong câu hỏi hiện tại đơn."},{"id":"present-negative-o","topic":"present-negative","level":"A1","type":"order","question":"Put the words in the correct order.","words":["Does","your","brother","work","here","?"],"correct":"Does your brother work here?","explain":"Does + S + V?"},{"id":"present-negative-e","topic":"present-negative","level":"A1","type":"correct","question":"He don't speak French.","correct":"He doesn't speak French.","explain":"He dùng doesn’t."}]},{"id":"articles","level":"A1","category":"Foundations","title":"Articles & Countable Nouns","vi":"Mạo từ và danh từ đếm được","formula":"a/an + singular noun · some + plural/uncountable noun","explanation":"Dùng a trước phụ âm, an trước nguyên âm theo âm đọc. Danh từ không đếm được thường không có a/an.","examples":[["She is an engineer.","Cô ấy là kỹ sư."],["I need some advice.","Tôi cần một ít lời khuyên."]],"mistake":"an advice → some advice","tip":"Chú ý âm đầu: an hour nhưng a university.","questions":[{"id":"articles-m1","topic":"articles","level":"A1","type":"mcq","question":"He bought ___ umbrella.","options":["a","an","some"],"correct":1,"explain":"Umbrella bắt đầu bằng nguyên âm /ʌ/."},{"id":"articles-m2","topic":"articles","level":"A1","type":"mcq","question":"I need ___ information.","options":["an","a","some"],"correct":2,"explain":"Information là danh từ không đếm được."},{"id":"articles-m3","topic":"articles","level":"A1","type":"mcq","question":"There are three ___ on the table.","options":["books","book","bookes"],"correct":0,"explain":"Sau three dùng danh từ số nhiều books."},{"id":"articles-m4","topic":"articles","level":"A1","type":"mcq","question":"It is ___ university.","options":["an","a","the an"],"correct":1,"explain":"University phát âm đầu /j/, dùng a."},{"id":"articles-f","topic":"articles","level":"A1","type":"fill","question":"She has ___ orange.","correct":"an","explain":"Orange bắt đầu bằng nguyên âm."},{"id":"articles-o","topic":"articles","level":"A1","type":"order","question":"Put the words in the correct order.","words":["I","have","some","good","news","."],"correct":"I have some good news.","explain":"News không đếm được."},{"id":"articles-e","topic":"articles","level":"A1","type":"correct","question":"She gave me an advice.","correct":"She gave me some advice.","explain":"Advice không đếm được: some advice."}]},{"id":"pronouns","level":"A1","category":"Foundations","title":"Pronouns & Possessives","vi":"Đại từ và sở hữu","formula":"I/me/my/mine · he/him/his · she/her/hers","explanation":"Dùng tính từ sở hữu trước danh từ; đại từ tân ngữ sau động từ hoặc giới từ.","examples":[["This is my notebook.","Đây là quyển vở của tôi."],["Please call her.","Hãy gọi cho cô ấy."]],"mistake":"This is mine book → This is my book","tip":"My + noun; mine đứng độc lập.","questions":[{"id":"pronouns-m1","topic":"pronouns","level":"A1","type":"mcq","question":"This is ___ bag.","options":["me","my","mine"],"correct":1,"explain":"Trước bag cần tính từ sở hữu my."},{"id":"pronouns-m2","topic":"pronouns","level":"A1","type":"mcq","question":"I saw ___ yesterday.","options":["she","her","hers"],"correct":1,"explain":"Tân ngữ sau saw là her."},{"id":"pronouns-m3","topic":"pronouns","level":"A1","type":"mcq","question":"This phone is ___.","options":["mine","my","me"],"correct":0,"explain":"Mine là đại từ sở hữu đứng một mình."},{"id":"pronouns-m4","topic":"pronouns","level":"A1","type":"mcq","question":"___ are studying English.","options":["Us","Our","We"],"correct":2,"explain":"We là chủ ngữ."},{"id":"pronouns-f","topic":"pronouns","level":"A1","type":"fill","question":"Peter is my friend. I know ___.","correct":"him","explain":"Sau know cần đại từ tân ngữ him."},{"id":"pronouns-o","topic":"pronouns","level":"A1","type":"order","question":"Put the words in the correct order.","words":["This","is","her","new","laptop","."],"correct":"This is her new laptop.","explain":"Her đứng trước noun."},{"id":"pronouns-e","topic":"pronouns","level":"A1","type":"correct","question":"That is mine book.","correct":"That is my book.","explain":"Trước noun dùng my."}]},{"id":"there","level":"A1","category":"Foundations","title":"There is / There are","vi":"Cấu trúc có – hiện hữu","formula":"There is + singular · There are + plural","explanation":"Dùng để nói có một hoặc nhiều người/vật ở một nơi.","examples":[["There is a library near here.","Có một thư viện gần đây."],["There are five students.","Có năm học viên."]],"mistake":"There is three books → There are three books","tip":"Số ít is; số nhiều are.","questions":[{"id":"there-m1","topic":"there","level":"A1","type":"mcq","question":"There ___ two chairs.","options":["is","are","am"],"correct":1,"explain":"Two chairs số nhiều."},{"id":"there-m2","topic":"there","level":"A1","type":"mcq","question":"There ___ a meeting today.","options":["are","be","is"],"correct":2,"explain":"A meeting số ít."},{"id":"there-m3","topic":"there","level":"A1","type":"mcq","question":"___ there any questions?","options":["Are","Is","Am"],"correct":0,"explain":"Questions số nhiều."},{"id":"there-m4","topic":"there","level":"A1","type":"mcq","question":"There ___ no milk left.","options":["are","is","am"],"correct":1,"explain":"Milk không đếm được, dùng is."},{"id":"there-f","topic":"there","level":"A1","type":"fill","question":"There ___ many people here.","correct":"are","explain":"People số nhiều."},{"id":"there-o","topic":"there","level":"A1","type":"order","question":"Put the words in the correct order.","words":["There","is","a","book","on","the","desk","."],"correct":"There is a book on the desk.","explain":"There is + singular noun."},{"id":"there-e","topic":"there","level":"A1","type":"correct","question":"There are a teacher in the room.","correct":"There is a teacher in the room.","explain":"A teacher số ít dùng is."}]},{"id":"prepositions","level":"A1","category":"Vocabulary & Grammar","title":"Prepositions of Time & Place","vi":"Giới từ thời gian và nơi chốn","formula":"at 7:00 · on Monday · in July · at/in/on (place)","explanation":"At với giờ; on với ngày; in với tháng/năm. Giới từ nơi chốn tùy ngữ cảnh.","examples":[["Our class starts at 7 p.m.","Lớp bắt đầu lúc 7 giờ tối."],["The test is on Friday.","Bài kiểm tra vào thứ Sáu."]],"mistake":"in Monday → on Monday","tip":"At = giờ; on = ngày; in = tháng/năm.","questions":[{"id":"prepositions-m1","topic":"prepositions","level":"A1","type":"mcq","question":"The class begins ___ 8 a.m.","options":["at","on","in"],"correct":0,"explain":"Giờ chính xác dùng at."},{"id":"prepositions-m2","topic":"prepositions","level":"A1","type":"mcq","question":"We study ___ Monday.","options":["in","at","on"],"correct":2,"explain":"Ngày trong tuần dùng on."},{"id":"prepositions-m3","topic":"prepositions","level":"A1","type":"mcq","question":"She was born ___ 1992.","options":["in","on","at"],"correct":0,"explain":"Năm dùng in."},{"id":"prepositions-m4","topic":"prepositions","level":"A1","type":"mcq","question":"The books are ___ the table.","options":["at","on","in"],"correct":1,"explain":"Bề mặt bàn dùng on."},{"id":"prepositions-f","topic":"prepositions","level":"A1","type":"fill","question":"My birthday is ___ October.","correct":"in","explain":"Tháng dùng in."},{"id":"prepositions-o","topic":"prepositions","level":"A1","type":"order","question":"Put the words in the correct order.","words":["The","meeting","is","on","Tuesday","."],"correct":"The meeting is on Tuesday.","explain":"On + day."},{"id":"prepositions-e","topic":"prepositions","level":"A1","type":"correct","question":"I work in Monday.","correct":"I work on Monday.","explain":"On + Monday."}]},{"id":"adjectives","level":"A1","category":"Foundations","title":"Adjectives & Adverbs","vi":"Tính từ và trạng từ","formula":"adjective + noun · verb + adverb","explanation":"Tính từ bổ nghĩa danh từ; trạng từ thường bổ nghĩa động từ.","examples":[["She is a careful nurse.","Cô ấy là điều dưỡng cẩn thận."],["She works carefully.","Cô ấy làm việc cẩn thận."]],"mistake":"He drives careful → He drives carefully","tip":"Sau be thường dùng adjective; bổ nghĩa động từ thường dùng adverb.","questions":[{"id":"adjectives-m1","topic":"adjectives","level":"A1","type":"mcq","question":"He speaks English ___.","options":["good","well","betterly"],"correct":1,"explain":"Speak là động từ, dùng well."},{"id":"adjectives-m2","topic":"adjectives","level":"A1","type":"mcq","question":"She is a ___ student.","options":["carefully","care","careful"],"correct":2,"explain":"Trước student dùng tính từ careful."},{"id":"adjectives-m3","topic":"adjectives","level":"A1","type":"mcq","question":"The exam is ___.","options":["easy","easily","ease"],"correct":0,"explain":"Sau is là tính từ easy."},{"id":"adjectives-m4","topic":"adjectives","level":"A1","type":"mcq","question":"They worked ___.","options":["hardly","hard","hardness"],"correct":1,"explain":"Work hard = làm việc chăm chỉ."},{"id":"adjectives-f","topic":"adjectives","level":"A1","type":"fill","question":"This is an ___ lesson.","correct":"interesting","explain":"Interesting bổ nghĩa lesson."},{"id":"adjectives-o","topic":"adjectives","level":"A1","type":"order","question":"Put the words in the correct order.","words":["The","teacher","speaks","clearly","."],"correct":"The teacher speaks clearly.","explain":"Clearly bổ nghĩa speaks."},{"id":"adjectives-e","topic":"adjectives","level":"A1","type":"correct","question":"She drives very careful.","correct":"She drives very carefully.","explain":"Động từ drives cần trạng từ carefully."}]},{"id":"continuous","level":"A2","category":"Tenses","title":"Present Continuous","vi":"Hiện tại tiếp diễn","formula":"S + am/is/are + V-ing","explanation":"Diễn tả hành động đang diễn ra hoặc kế hoạch tương lai đã sắp xếp.","examples":[["I am studying now.","Tôi đang học bây giờ."],["We are meeting tomorrow.","Chúng tôi sẽ gặp nhau ngày mai (đã lên lịch)."]],"mistake":"She studying → She is studying","tip":"Now, at the moment thường là dấu hiệu.","questions":[{"id":"continuous-m1","topic":"continuous","level":"A2","type":"mcq","question":"Look! The children ___ outside.","options":["play","are playing","played"],"correct":1,"explain":"Look! gợi ý hành động đang diễn ra."},{"id":"continuous-m2","topic":"continuous","level":"A2","type":"mcq","question":"He ___ a report right now.","options":["writes","is writing","wrote"],"correct":1,"explain":"Right now → is writing."},{"id":"continuous-m3","topic":"continuous","level":"A2","type":"mcq","question":"I ___ listening to music.","options":["am","is","are"],"correct":0,"explain":"I dùng am."},{"id":"continuous-m4","topic":"continuous","level":"A2","type":"mcq","question":"We ___ dinner with our teacher tonight.","options":["have","are having","had"],"correct":1,"explain":"Kế hoạch đã sắp xếp có thể dùng are having."},{"id":"continuous-f","topic":"continuous","level":"A2","type":"fill","question":"They ___ working now.","correct":"are","explain":"They + are + V-ing."},{"id":"continuous-o","topic":"continuous","level":"A2","type":"order","question":"Put the words in the correct order.","words":["She","is","reading","a","book","now","."],"correct":"She is reading a book now.","explain":"S + be + V-ing."},{"id":"continuous-e","topic":"continuous","level":"A2","type":"correct","question":"He are watching TV.","correct":"He is watching TV.","explain":"He số ít dùng is."}]},{"id":"past","level":"A2","category":"Tenses","title":"Past Simple","vi":"Quá khứ đơn","formula":"S + V2/ed · S + did not + V · Did + S + V?","explanation":"Dùng cho hành động đã xảy ra và kết thúc trong quá khứ.","examples":[["I visited Da Nang last year.","Tôi đã thăm Đà Nẵng năm ngoái."],["She didn't go yesterday.","Hôm qua cô ấy không đi."]],"mistake":"didn't went → didn't go","tip":"Yesterday/last/ago là tín hiệu thường gặp.","questions":[{"id":"past-m1","topic":"past","level":"A2","type":"mcq","question":"We ___ the lesson yesterday.","options":["finish","finished","finishes"],"correct":1,"explain":"Yesterday → Past Simple: finished."},{"id":"past-m2","topic":"past","level":"A2","type":"mcq","question":"Did you ___ the email?","options":["sent","sending","send"],"correct":2,"explain":"Sau did dùng V nguyên mẫu."},{"id":"past-m3","topic":"past","level":"A2","type":"mcq","question":"She ___ to work last Monday.","options":["went","go","goes"],"correct":0,"explain":"Last Monday → went."},{"id":"past-m4","topic":"past","level":"A2","type":"mcq","question":"They ___ at home last night.","options":["was","were","are"],"correct":1,"explain":"They + were trong quá khứ."},{"id":"past-f","topic":"past","level":"A2","type":"fill","question":"He ___ not work yesterday.","correct":"did","explain":"Phủ định: did not + V."},{"id":"past-o","topic":"past","level":"A2","type":"order","question":"Put the words in the correct order.","words":["I","sent","the","report","yesterday","."],"correct":"I sent the report yesterday.","explain":"S + V2 + O + time."},{"id":"past-e","topic":"past","level":"A2","type":"correct","question":"I didn't went to school yesterday.","correct":"I didn't go to school yesterday.","explain":"Sau didn’t dùng go."}]},{"id":"past-continuous","level":"A2","category":"Tenses","title":"Past Continuous","vi":"Quá khứ tiếp diễn","formula":"S + was/were + V-ing","explanation":"Diễn tả hành động đang diễn ra tại thời điểm quá khứ; thường đi cùng when/while.","examples":[["I was reading when she called.","Tôi đang đọc thì cô ấy gọi."],["They were studying at 8 p.m.","Họ đang học lúc 8 giờ tối."]],"mistake":"I was read → I was reading","tip":"Hành động dài: past continuous; hành động xen vào: past simple.","questions":[{"id":"past-continuous-m1","topic":"past-continuous","level":"A2","type":"mcq","question":"He ___ TV when I arrived.","options":["watched","was watching","watches"],"correct":1,"explain":"Đang diễn ra khi tôi đến → was watching."},{"id":"past-continuous-m2","topic":"past-continuous","level":"A2","type":"mcq","question":"They ___ playing at six.","options":["was","were","are"],"correct":1,"explain":"They + were playing."},{"id":"past-continuous-m3","topic":"past-continuous","level":"A2","type":"mcq","question":"While she ___, the phone rang.","options":["cooked","was cooking","cooks"],"correct":1,"explain":"While diễn tả hành động đang diễn ra."},{"id":"past-continuous-m4","topic":"past-continuous","level":"A2","type":"mcq","question":"I ___ driving when it started to rain.","options":["am","was","were"],"correct":1,"explain":"I + was driving."},{"id":"past-continuous-f","topic":"past-continuous","level":"A2","type":"fill","question":"We ___ waiting for the bus.","correct":"were","explain":"We + were + V-ing."},{"id":"past-continuous-o","topic":"past-continuous","level":"A2","type":"order","question":"Put the words in the correct order.","words":["I","was","working","when","you","called","."],"correct":"I was working when you called.","explain":"Was working kéo dài; called xen vào."},{"id":"past-continuous-e","topic":"past-continuous","level":"A2","type":"correct","question":"They was watching a movie.","correct":"They were watching a movie.","explain":"They + were."}]},{"id":"present-perfect","level":"A2","category":"Tenses","title":"Present Perfect","vi":"Hiện tại hoàn thành","formula":"S + have/has + V3","explanation":"Dùng cho trải nghiệm, kết quả còn liên quan hiện tại, thời gian chưa kết thúc.","examples":[["I have finished my homework.","Tôi đã hoàn thành bài tập."],["She has never been to Japan.","Cô ấy chưa từng đến Nhật."]],"mistake":"She have finished → She has finished","tip":"Ever/never/already/yet/since/for thường đi cùng thì này.","questions":[{"id":"present-perfect-m1","topic":"present-perfect","level":"A2","type":"mcq","question":"She ___ already eaten lunch.","options":["have","has","had"],"correct":1,"explain":"She dùng has."},{"id":"present-perfect-m2","topic":"present-perfect","level":"A2","type":"mcq","question":"I have ___ this film before.","options":["see","saw","seen"],"correct":2,"explain":"Have + V3 seen."},{"id":"present-perfect-m3","topic":"present-perfect","level":"A2","type":"mcq","question":"They ___ worked here since 2020.","options":["have","has","are"],"correct":0,"explain":"They + have worked."},{"id":"present-perfect-m4","topic":"present-perfect","level":"A2","type":"mcq","question":"Have you ___ to Ha Noi?","options":["be","been","being"],"correct":1,"explain":"Have + been."},{"id":"present-perfect-f","topic":"present-perfect","level":"A2","type":"fill","question":"He ___ just arrived.","correct":"has","explain":"He + has + V3."},{"id":"present-perfect-o","topic":"present-perfect","level":"A2","type":"order","question":"Put the words in the correct order.","words":["I","have","finished","my","homework","."],"correct":"I have finished my homework.","explain":"Have + past participle."},{"id":"present-perfect-e","topic":"present-perfect","level":"A2","type":"correct","question":"She has went home.","correct":"She has gone home.","explain":"Go - went - gone."}]},{"id":"past-perfect","level":"A2","category":"Tenses","title":"Past Perfect","vi":"Quá khứ hoàn thành","formula":"S + had + V3","explanation":"Hành động xảy ra trước một hành động hoặc mốc thời gian trong quá khứ.","examples":[["The bus had left before I arrived.","Xe buýt đã rời đi trước khi tôi đến."],["She had finished before noon.","Cô ấy đã xong trước buổi trưa."]],"mistake":"had went → had gone","tip":"By the time thường giúp xác định trình tự.","questions":[{"id":"past-perfect-m1","topic":"past-perfect","level":"A2","type":"mcq","question":"The train ___ left before we arrived.","options":["has","had","have"],"correct":1,"explain":"Xảy ra trước một mốc quá khứ → had left."},{"id":"past-perfect-m2","topic":"past-perfect","level":"A2","type":"mcq","question":"She had ___ the report before noon.","options":["write","wrote","written"],"correct":2,"explain":"Had + written."},{"id":"past-perfect-m3","topic":"past-perfect","level":"A2","type":"mcq","question":"By the time I got there, they ___ gone.","options":["had","has","have"],"correct":0,"explain":"By the time + past → had gone."},{"id":"past-perfect-m4","topic":"past-perfect","level":"A2","type":"mcq","question":"He had ___ dinner before the meeting.","options":["ate","eaten","eat"],"correct":1,"explain":"Had + V3 eaten."},{"id":"past-perfect-f","topic":"past-perfect","level":"A2","type":"fill","question":"They ___ finished before I came.","correct":"had","explain":"Had + V3."},{"id":"past-perfect-o","topic":"past-perfect","level":"A2","type":"order","question":"Put the words in the correct order.","words":["The","bus","had","left","before","I","arrived","."],"correct":"The bus had left before I arrived.","explain":"Hành động rời đi xảy ra trước."},{"id":"past-perfect-e","topic":"past-perfect","level":"A2","type":"correct","question":"She had saw the movie.","correct":"She had seen the movie.","explain":"See - saw - seen."}]},{"id":"future","level":"A2","category":"Tenses","title":"Future: Will vs Going to","vi":"Tương lai đơn và dự định","formula":"will + V · am/is/are going to + V","explanation":"Will thường cho quyết định tại thời điểm nói/dự đoán; going to cho kế hoạch/dấu hiệu hiện tại.","examples":[["I will help you.","Tôi sẽ giúp bạn."],["Look at the clouds! It is going to rain.","Nhìn mây kìa! Trời sắp mưa."]],"mistake":"will to go → will go","tip":"Không có to sau will.","questions":[{"id":"future-m1","topic":"future","level":"A2","type":"mcq","question":"Look at those clouds! It ___ rain.","options":["will be","is going to","was"],"correct":1,"explain":"Có dấu hiệu hiện tại → going to."},{"id":"future-m2","topic":"future","level":"A2","type":"mcq","question":"I think you ___ enjoy the lesson.","options":["will","are","were"],"correct":0,"explain":"Dự đoán → will."},{"id":"future-m3","topic":"future","level":"A2","type":"mcq","question":"We are going ___ study later.","options":["for","to","at"],"correct":1,"explain":"Be going to + V."},{"id":"future-m4","topic":"future","level":"A2","type":"mcq","question":"I ___ carry your bag for you.","options":["will","am going","was"],"correct":0,"explain":"Lời đề nghị ngay lúc nói → will."},{"id":"future-f","topic":"future","level":"A2","type":"fill","question":"She ___ going to call her friend.","correct":"is","explain":"She + is going to."},{"id":"future-o","topic":"future","level":"A2","type":"order","question":"Put the words in the correct order.","words":["They","are","going","to","travel","tomorrow","."],"correct":"They are going to travel tomorrow.","explain":"Be going to + V."},{"id":"future-e","topic":"future","level":"A2","type":"correct","question":"I will to visit you.","correct":"I will visit you.","explain":"Will + V nguyên mẫu."}]},{"id":"modals","level":"A2","category":"Structures","title":"Modal Verbs","vi":"Động từ khuyết thiếu","formula":"can / should / must / might + V (bare)","explanation":"Sau động từ khuyết thiếu dùng V nguyên mẫu không to; nghĩa thay đổi theo modal.","examples":[["You should rest.","Bạn nên nghỉ ngơi."],["You must wear a helmet.","Bạn phải đội mũ bảo hiểm."]],"mistake":"should to study → should study","tip":"Mustn’t là cấm; don’t have to là không bắt buộc.","questions":[{"id":"modals-m1","topic":"modals","level":"A2","type":"mcq","question":"You ___ wear a seat belt.","options":["must","might to","can to"],"correct":0,"explain":"Must + V nguyên mẫu."},{"id":"modals-m2","topic":"modals","level":"A2","type":"mcq","question":"She can ___ English.","options":["speaks","speak","speaking"],"correct":1,"explain":"Can + speak."},{"id":"modals-m3","topic":"modals","level":"A2","type":"mcq","question":"You ___ smoke in this room.","options":["mustn’t","don’t have to","could"],"correct":0,"explain":"Mustn’t = không được phép."},{"id":"modals-m4","topic":"modals","level":"A2","type":"mcq","question":"He looks tired. He ___ rest.","options":["should","must to","should to"],"correct":0,"explain":"Đưa lời khuyên: should + rest."},{"id":"modals-f","topic":"modals","level":"A2","type":"fill","question":"You ___ study for the test.","correct":"should","explain":"Should = nên."},{"id":"modals-o","topic":"modals","level":"A2","type":"order","question":"Put the words in the correct order.","words":["You","must","follow","the","rules","."],"correct":"You must follow the rules.","explain":"Must + V."},{"id":"modals-e","topic":"modals","level":"A2","type":"correct","question":"He should to go home.","correct":"He should go home.","explain":"Should + bare V."}]},{"id":"comparison","level":"A2","category":"Structures","title":"Comparatives & Quantifiers","vi":"So sánh và lượng từ","formula":"-er / more + adj + than · fewer/much/many","explanation":"Dùng so sánh hơn để đối chiếu hai đối tượng; lượng từ tùy loại danh từ.","examples":[["This lesson is easier than that one.","Bài học này dễ hơn bài kia."],["I have fewer books than you.","Tôi có ít sách hơn bạn."]],"mistake":"more taller → taller","tip":"Fewer với danh từ đếm được; less với không đếm được.","questions":[{"id":"comparison-m1","topic":"comparison","level":"A2","type":"mcq","question":"My brother is taller ___ me.","options":["that","than","then"],"correct":1,"explain":"So sánh hơn đi với than."},{"id":"comparison-m2","topic":"comparison","level":"A2","type":"mcq","question":"This problem is ___ than the last one.","options":["more difficult","difficulter","most difficult"],"correct":0,"explain":"Difficult dài → more difficult."},{"id":"comparison-m3","topic":"comparison","level":"A2","type":"mcq","question":"We have ___ students this week.","options":["less","fewer","little"],"correct":1,"explain":"Students đếm được → fewer."},{"id":"comparison-m4","topic":"comparison","level":"A2","type":"mcq","question":"How ___ water do you need?","options":["many","few","much"],"correct":2,"explain":"Water không đếm được → much."},{"id":"comparison-f","topic":"comparison","level":"A2","type":"fill","question":"She is ___ than her sister.","correct":"older","explain":"Old → older."},{"id":"comparison-o","topic":"comparison","level":"A2","type":"order","question":"Put the words in the correct order.","words":["This","book","is","more","interesting","than","that","one","."],"correct":"This book is more interesting than that one.","explain":"More + adjective + than."},{"id":"comparison-e","topic":"comparison","level":"A2","type":"correct","question":"My car is more faster than yours.","correct":"My car is faster than yours.","explain":"Không dùng more với faster."}]},{"id":"gerunds","level":"A2","category":"Structures","title":"Gerunds & Infinitives","vi":"Danh động từ và động từ nguyên thể","formula":"enjoy + V-ing · want/hope + to V · modal + V","explanation":"Một số động từ theo sau bởi V-ing, một số bởi to-V; giới từ thường đi với V-ing.","examples":[["I enjoy reading.","Tôi thích đọc sách."],["She hopes to pass the exam.","Cô ấy hy vọng đỗ kỳ thi."]],"mistake":"enjoy to read → enjoy reading","tip":"Sau giới từ dùng V-ing; sau should dùng nguyên mẫu.","questions":[{"id":"gerunds-m1","topic":"gerunds","level":"A2","type":"mcq","question":"I enjoy ___ English.","options":["learn","learning","to learning"],"correct":1,"explain":"Enjoy + V-ing."},{"id":"gerunds-m2","topic":"gerunds","level":"A2","type":"mcq","question":"She wants ___ a teacher.","options":["be","being","to be"],"correct":2,"explain":"Want + to-V."},{"id":"gerunds-m3","topic":"gerunds","level":"A2","type":"mcq","question":"We hope ___ you soon.","options":["to see","seeing","see to"],"correct":0,"explain":"Hope + to-V."},{"id":"gerunds-m4","topic":"gerunds","level":"A2","type":"mcq","question":"He is interested in ___ music.","options":["listen","listening to","to listen"],"correct":1,"explain":"In + V-ing; listen to music."},{"id":"gerunds-f","topic":"gerunds","level":"A2","type":"fill","question":"My friend avoids ___ late.","correct":"being","explain":"Avoid + V-ing."},{"id":"gerunds-o","topic":"gerunds","level":"A2","type":"order","question":"Put the words in the correct order.","words":["She","wants","to","learn","English","."],"correct":"She wants to learn English.","explain":"Want + to-V."},{"id":"gerunds-e","topic":"gerunds","level":"A2","type":"correct","question":"I enjoy to play tennis.","correct":"I enjoy playing tennis.","explain":"Enjoy + V-ing."}]},{"id":"passive","level":"A2","category":"Structures","title":"Passive Voice","vi":"Câu bị động","formula":"be + V3 (is built / was built / is being shown)","explanation":"Nhấn mạnh đối tượng chịu tác động; be chia theo thì và chủ ngữ.","examples":[["The lesson is taught in English.","Bài học được dạy bằng tiếng Anh."],["The bridge was built in 2010.","Cây cầu được xây năm 2010."]],"mistake":"was build → was built","tip":"Phân biệt be trong hiện tại và quá khứ.","questions":[{"id":"passive-m1","topic":"passive","level":"A2","type":"mcq","question":"The school ___ built in 2005.","options":["is","was","were"],"correct":1,"explain":"Mốc quá khứ 2005 → was built."},{"id":"passive-m2","topic":"passive","level":"A2","type":"mcq","question":"English ___ spoken here.","options":["is","are","be"],"correct":0,"explain":"English số ít → is spoken."},{"id":"passive-m3","topic":"passive","level":"A2","type":"mcq","question":"These letters ___ sent yesterday.","options":["was","is","were"],"correct":2,"explain":"Letters số nhiều, quá khứ → were sent."},{"id":"passive-m4","topic":"passive","level":"A2","type":"mcq","question":"The reports are ___ every Friday.","options":["write","written","wrote"],"correct":1,"explain":"Be + V3 written."},{"id":"passive-f","topic":"passive","level":"A2","type":"fill","question":"The movie ___ shown every week.","correct":"is","explain":"Movie số ít hiện tại: is shown."},{"id":"passive-o","topic":"passive","level":"A2","type":"order","question":"Put the words in the correct order.","words":["The","window","was","broken","yesterday","."],"correct":"The window was broken yesterday.","explain":"Was + V3."},{"id":"passive-e","topic":"passive","level":"A2","type":"correct","question":"The letter was write yesterday.","correct":"The letter was written yesterday.","explain":"Write - wrote - written."}]},{"id":"conditional1","level":"B1","category":"Conditionals","title":"First Conditional","vi":"Câu điều kiện loại 1","formula":"If + Present Simple, S + will + V","explanation":"Diễn tả điều kiện có thể xảy ra trong tương lai và kết quả của nó.","examples":[["If it rains, we will stay home.","Nếu trời mưa, chúng tôi sẽ ở nhà."],["If you practise, you will improve.","Nếu bạn luyện tập, bạn sẽ tiến bộ."]],"mistake":"If it will rain → If it rains","tip":"Mệnh đề if không dùng will cho điều kiện loại 1 thông thường.","questions":[{"id":"conditional1-m1","topic":"conditional1","level":"B1","type":"mcq","question":"If I ___ time, I will help you.","options":["have","will have","had"],"correct":0,"explain":"If + hiện tại đơn."},{"id":"conditional1-m2","topic":"conditional1","level":"B1","type":"mcq","question":"If it rains, we ___ at home.","options":["stay","stayed","will stay"],"correct":2,"explain":"Mệnh đề chính will + V."},{"id":"conditional1-m3","topic":"conditional1","level":"B1","type":"mcq","question":"She will pass if she ___ hard.","options":["studies","will study","study"],"correct":0,"explain":"If + studies ở hiện tại đơn."},{"id":"conditional1-m4","topic":"conditional1","level":"B1","type":"mcq","question":"If you ___ late, call me.","options":["are","will be","were"],"correct":0,"explain":"If you are late là điều kiện thực tế."},{"id":"conditional1-f","topic":"conditional1","level":"B1","type":"fill","question":"If he calls, I ___ answer.","correct":"will","explain":"Kết quả tương lai → will answer."},{"id":"conditional1-o","topic":"conditional1","level":"B1","type":"order","question":"Put the words in the correct order.","words":["If","you","study","you","will","improve","."],"correct":"If you study you will improve.","explain":"If + present, will + V."},{"id":"conditional1-e","topic":"conditional1","level":"B1","type":"correct","question":"If it will rain, we will stay home.","correct":"If it rains, we will stay home.","explain":"Sau if dùng hiện tại đơn."}]},{"id":"conditional23","level":"B1","category":"Conditionals","title":"Second & Third Conditionals","vi":"Câu điều kiện loại 2 và 3","formula":"If + Past, would + V · If + Past Perfect, would have + V3","explanation":"Loại 2: giả định hiện tại/ tương lai; loại 3: giả định trái ngược quá khứ.","examples":[["If I were you, I would study more.","Nếu tôi là bạn, tôi sẽ học thêm."],["If she had studied, she would have passed.","Nếu cô ấy đã học, cô ấy đã đỗ."]],"mistake":"would have pass → would have passed","tip":"If I were you dùng were trong văn phong chuẩn.","questions":[{"id":"conditional23-m1","topic":"conditional23","level":"B1","type":"mcq","question":"If I were rich, I ___ travel.","options":["will","would","had"],"correct":1,"explain":"Điều kiện loại 2 → would + V."},{"id":"conditional23-m2","topic":"conditional23","level":"B1","type":"mcq","question":"If she had left earlier, she ___ the bus.","options":["would catch","would have caught","will catch"],"correct":1,"explain":"Loại 3 → would have + V3."},{"id":"conditional23-m3","topic":"conditional23","level":"B1","type":"mcq","question":"If I ___ you, I would apologise.","options":["were","am","will be"],"correct":0,"explain":"Giả định hiện tại → were."},{"id":"conditional23-m4","topic":"conditional23","level":"B1","type":"mcq","question":"If he had tried, he ___ succeeded.","options":["would have","would","will"],"correct":0,"explain":"Would have succeeded."},{"id":"conditional23-f","topic":"conditional23","level":"B1","type":"fill","question":"If you had called, I ___ have answered.","correct":"would","explain":"Điều kiện loại 3 → would have answered."},{"id":"conditional23-o","topic":"conditional23","level":"B1","type":"order","question":"Put the words in the correct order.","words":["If","I","were","you","I","would","wait","."],"correct":"If I were you I would wait.","explain":"Past + would + V."},{"id":"conditional23-e","topic":"conditional23","level":"B1","type":"correct","question":"If I was you, I will study more.","correct":"If I were you, I would study more.","explain":"Loại 2: were + would."}]},{"id":"relative","level":"B1","category":"Structures","title":"Relative Clauses","vi":"Mệnh đề quan hệ","formula":"who (people) · which (things) · where (places) · whose (possession)","explanation":"Dùng đại từ/trạng từ quan hệ để nối thông tin về người, vật hoặc nơi chốn.","examples":[["This is the woman who teaches us.","Đây là người phụ nữ dạy chúng tôi."],["This is the town where I grew up.","Đây là thị trấn nơi tôi lớn lên."]],"mistake":"the person which → the person who","tip":"Where = nơi mà; which = cái mà.","questions":[{"id":"relative-m1","topic":"relative","level":"B1","type":"mcq","question":"This is the man ___ helped me.","options":["which","who","where"],"correct":1,"explain":"Who chỉ người."},{"id":"relative-m2","topic":"relative","level":"B1","type":"mcq","question":"I bought a book ___ was interesting.","options":["who","where","which"],"correct":2,"explain":"Which chỉ vật."},{"id":"relative-m3","topic":"relative","level":"B1","type":"mcq","question":"This is the school ___ I studied.","options":["where","whose","who"],"correct":0,"explain":"Where chỉ nơi chốn."},{"id":"relative-m4","topic":"relative","level":"B1","type":"mcq","question":"The student ___ bag is red is here.","options":["which","whose","where"],"correct":1,"explain":"Whose chỉ sở hữu."},{"id":"relative-f","topic":"relative","level":"B1","type":"fill","question":"The teacher ___ lives next door is kind.","correct":"who","explain":"Who = người."},{"id":"relative-o","topic":"relative","level":"B1","type":"order","question":"Put the words in the correct order.","words":["This","is","the","book","which","I","bought","."],"correct":"This is the book which I bought.","explain":"Which liên kết với book."},{"id":"relative-e","topic":"relative","level":"B1","type":"correct","question":"This is the town which I was born.","correct":"This is the town where I was born.","explain":"Where chỉ nơi chốn."}]},{"id":"wish","level":"B1","category":"Structures","title":"Wish & Used to","vi":"Cấu trúc wish và used to","formula":"wish + Past Simple · wish + had V3 · used to + V","explanation":"Wish diễn tả điều ước trái thực tế; used to cho thói quen/trạng thái trong quá khứ.","examples":[["I wish I had more time.","Ước gì tôi có nhiều thời gian hơn."],["I used to walk to school.","Trước đây tôi từng đi bộ đến trường."]],"mistake":"I used to walking → I used to walk","tip":"Be used to + V-ing khác used to + V.","questions":[{"id":"wish-m1","topic":"wish","level":"B1","type":"mcq","question":"I wish I ___ taller.","options":["am","were","will be"],"correct":1,"explain":"Điều ước hiện tại dùng quá khứ giả định."},{"id":"wish-m2","topic":"wish","level":"B1","type":"mcq","question":"She used to ___ here.","options":["works","working","work"],"correct":2,"explain":"Used to + V nguyên mẫu."},{"id":"wish-m3","topic":"wish","level":"B1","type":"mcq","question":"I wish I had ___ harder.","options":["study","studying","studied"],"correct":2,"explain":"Ước quá khứ: had + V3."},{"id":"wish-m4","topic":"wish","level":"B1","type":"mcq","question":"He is used to ___ early.","options":["getting up","get up","got up"],"correct":0,"explain":"Be used to + V-ing."},{"id":"wish-f","topic":"wish","level":"B1","type":"fill","question":"I used to ___ football every day.","correct":"play","explain":"Used to + V."},{"id":"wish-o","topic":"wish","level":"B1","type":"order","question":"Put the words in the correct order.","words":["I","wish","I","had","more","free","time","."],"correct":"I wish I had more free time.","explain":"Wish + past simple."},{"id":"wish-e","topic":"wish","level":"B1","type":"correct","question":"She used to playing tennis.","correct":"She used to play tennis.","explain":"Used to + V; không dùng V-ing."}]},{"id":"reported","level":"B1","category":"Structures","title":"Reported Speech","vi":"Câu tường thuật","formula":"said (that) S + V(backshift) · asked if/whether","explanation":"Khi tường thuật lời nói trong ngữ cảnh quá khứ, thường lùi thì và đổi đại từ/trạng từ phù hợp.","examples":[["He said he was tired.","Anh ấy nói rằng anh ấy mệt."],["She asked if I was ready.","Cô ấy hỏi tôi đã sẵn sàng chưa."]],"mistake":"He said he is tired → He said he was tired (in past reporting)","tip":"Lùi thì không bắt buộc nếu sự thật vẫn còn đúng; ví dụ này đặt trong ngữ cảnh quá khứ.","questions":[{"id":"reported-m1","topic":"reported","level":"B1","type":"mcq","question":"He said he ___ busy that day.","options":["is","was","be"],"correct":1,"explain":"Tường thuật lời nói quá khứ: was."},{"id":"reported-m2","topic":"reported","level":"B1","type":"mcq","question":"She asked me ___ I liked tea.","options":["if","that","which"],"correct":0,"explain":"Câu hỏi Yes/No dùng if/whether."},{"id":"reported-m3","topic":"reported","level":"B1","type":"mcq","question":"He told me ___ quiet.","options":["be","being","to be"],"correct":2,"explain":"Tell somebody to do something."},{"id":"reported-m4","topic":"reported","level":"B1","type":"mcq","question":"She said she ___ finished the work.","options":["had","has","have"],"correct":0,"explain":"Backshift: had finished."},{"id":"reported-f","topic":"reported","level":"B1","type":"fill","question":"He asked ___ I was ready.","correct":"if","explain":"If/whether trong reported yes/no questions."},{"id":"reported-o","topic":"reported","level":"B1","type":"order","question":"Put the words in the correct order.","words":["She","said","she","was","tired","."],"correct":"She said she was tired.","explain":"Said + reported clause."},{"id":"reported-e","topic":"reported","level":"B1","type":"correct","question":"He told me be quiet.","correct":"He told me to be quiet.","explain":"Tell + object + to-V."}]},{"id":"connectors","level":"B1","category":"Structures","title":"Connectors & FANBOYS","vi":"Liên từ nối câu","formula":"for · and · nor · but · or · yet · so","explanation":"Liên từ chỉ bổ sung, đối lập, lựa chọn, kết quả; when/while/unless nối mệnh đề.","examples":[["I was tired, but I kept studying.","Tôi mệt nhưng vẫn tiếp tục học."],["It was raining, so we stayed home.","Trời mưa nên chúng tôi ở nhà."]],"mistake":"although ... but → although ... ,","tip":"Không dùng although và but đồng thời để nối cùng cặp mệnh đề.","questions":[{"id":"connectors-m1","topic":"connectors","level":"B1","type":"mcq","question":"It was late, ___ we went home.","options":["so","but","or"],"correct":0,"explain":"So diễn tả kết quả."},{"id":"connectors-m2","topic":"connectors","level":"B1","type":"mcq","question":"I like tea, ___ she likes coffee.","options":["so","but","nor"],"correct":1,"explain":"But diễn tả đối lập."},{"id":"connectors-m3","topic":"connectors","level":"B1","type":"mcq","question":"You can call me ___ send an email.","options":["or","so","yet"],"correct":0,"explain":"Or diễn tả lựa chọn."},{"id":"connectors-m4","topic":"connectors","level":"B1","type":"mcq","question":"We will go ___ it rains.","options":["unless","because of","despite"],"correct":0,"explain":"Unless = if not."},{"id":"connectors-f","topic":"connectors","level":"B1","type":"fill","question":"She is busy, ___ she can help tomorrow.","correct":"but","explain":"But nối ý tương phản."},{"id":"connectors-o","topic":"connectors","level":"B1","type":"order","question":"Put the words in the correct order.","words":["It","rained","so","we","stayed","home","."],"correct":"It rained so we stayed home.","explain":"So nối nguyên nhân–kết quả."},{"id":"connectors-e","topic":"connectors","level":"B1","type":"correct","question":"Although she was tired but she studied.","correct":"Although she was tired, she studied.","explain":"Không dùng although + but cùng lúc."}]},{"id":"tags","level":"B1","category":"Structures","title":"Question Tags","vi":"Câu hỏi đuôi","formula":"positive, negative tag? · negative, positive tag?","explanation":"Đuôi thường trái dấu với mệnh đề và dùng cùng trợ động từ, chủ ngữ đại từ.","examples":[["She is a teacher, isn't she?","Cô ấy là giáo viên, phải không?"],["You don't work here, do you?","Bạn không làm ở đây, đúng không?"]],"mistake":"She likes tea, isn't she? → doesn't she?","tip":"Với câu mệnh lệnh có các dạng đuôi riêng, ví dụ will you?","questions":[{"id":"tags-m1","topic":"tags","level":"B1","type":"mcq","question":"She is tired, ___?","options":["is she","isn't she","doesn't she"],"correct":1,"explain":"Is → isn’t."},{"id":"tags-m2","topic":"tags","level":"B1","type":"mcq","question":"They don't study here, ___?","options":["do they","don’t they","are they"],"correct":0,"explain":"Don’t → do they?"},{"id":"tags-m3","topic":"tags","level":"B1","type":"mcq","question":"He works here, ___?","options":["isn't he","doesn't he","does he"],"correct":1,"explain":"Present Simple → doesn’t he?"},{"id":"tags-m4","topic":"tags","level":"B1","type":"mcq","question":"Don't be late, ___?","options":["will you","are you","do you"],"correct":0,"explain":"Mệnh lệnh phủ định thường dùng will you?"},{"id":"tags-f","topic":"tags","level":"B1","type":"fill","question":"We are ready, ___ we?","correct":"aren't","explain":"Are → aren’t we?"},{"id":"tags-o","topic":"tags","level":"B1","type":"order","question":"Put the words in the correct order.","words":["She","is","your","teacher","isn’t","she","?"],"correct":"She is your teacher, isn't she?","explain":"Câu khẳng định → đuôi phủ định."},{"id":"tags-e","topic":"tags","level":"B1","type":"correct","question":"You like music, isn't it?","correct":"You like music, don't you?","explain":"Like → do/don’t cho câu hỏi đuôi."}]},{"id":"perfect-advanced","level":"B1","category":"Tenses","title":"Perfect Continuous & Future Perfect","vi":"Hoàn thành tiếp diễn và tương lai hoàn thành","formula":"have/has been + V-ing · will have + V3","explanation":"Nhấn mạnh quá trình kéo dài đến hiện tại, hoặc kết quả hoàn tất trước mốc tương lai.","examples":[["She has been working all day.","Cô ấy đã làm việc suốt ngày."],["By Friday, I will have finished.","Đến thứ Sáu tôi sẽ hoàn thành."]],"mistake":"will have finish → will have finished","tip":"By + mốc tương lai thường dùng Future Perfect.","questions":[{"id":"perfect-advanced-m1","topic":"perfect-advanced","level":"B1","type":"mcq","question":"He has been ___ since morning.","options":["work","worked","working"],"correct":2,"explain":"Has been + V-ing."},{"id":"perfect-advanced-m2","topic":"perfect-advanced","level":"B1","type":"mcq","question":"By next week, we will have ___ the project.","options":["finished","finish","finishing"],"correct":0,"explain":"Will have + V3."},{"id":"perfect-advanced-m3","topic":"perfect-advanced","level":"B1","type":"mcq","question":"They ___ been studying for hours.","options":["have","has","are"],"correct":0,"explain":"They + have been."},{"id":"perfect-advanced-m4","topic":"perfect-advanced","level":"B1","type":"mcq","question":"She will ___ completed the course by June.","options":["has" function lessons(){let filtered=LESSONS.filter(l=>(state.level==='all'||l.level===state.level)&&(!state.search||`${l.title} ${l.vi} ${l.formula} ${l.category}`.toLowerCase().includes(state.search.toLowerCase())));return `<div class="section-head" style="margin-top:0"><div><div class="eyebrow">STUDY LIBRARY</div><h2>26 bài học ngữ pháp</h2><p>Mỗi bài gồm lý thuyết, công thức, ví dụ Anh–Việt và bài luyện nhanh.</p></div></div><div class="toolbar-line"><input class="field" id="search-lessons" placeholder="Tìm theo từ khóa hoặc cấu trúc..." value="${esc(state.search)}" aria-label="Tìm bài học"><select class="select" id="filter-lessons"><option value="all">Tất cả cấp độ</option>${['A1','A2','B1'].map(l=>`<option value="${l}" ${state.level===l?'selected':''}>${l}</option>`).join('')}</select><span class="tiny">${filtered.length} bài học</span></div>${filtered.length?`<div class="grid3">${filtered.map(cardLesson).join('')}</div>`:'<div class="empty">Không tìm thấy bài học. Hãy thử từ khóa khác.</div>'}`;}
function lesson(){let l=BY_ID[state.topic],isRead=store.readLessons.includes(l.id);return `<a class="backlink" href="#lessons">← Tất cả bài học</a><div class="lesson-page"><div class="leftcol"><article class="panel"><div class="steps">${badge(l.level)}<span>${esc(l.category)} / ${esc(l.vi)}</span></div><h1>${esc(l.title)}</h1><p>${esc(l.explanation)}</p><h2>Công thức cần nhớ</h2><div class="formula">${esc(l.formula)}</div><h2>Ví dụ dễ nhớ</h2>${l.examples.map(([en,vi])=>`<div class="example"><strong>${esc(en)} <button class="btn small secondary" style="margin-left:7px" data-speak="${esc(en)}" title="Nghe phát âm">▶</button></strong><span>${esc(vi)}</span></div>`).join('')}<h2>Lỗi thường gặp</h2><div class="note warn">${esc(l.mistake)}</div><h2>Mẹo làm bài</h2><div class="note">${esc(l.tip)}</div><hr class="separator"><div class="actions"><button class="btn" data-start-lesson="${l.id}">Luyện ${l.questions.length} câu →</button><button class="btn secondary" data-mark-read="${l.id}">${isRead?'✓ Đã đánh dấu học':'✓ Đánh dấu đã học'}</button></div></article></div><aside class="lesson-side"><div class="card"><div class="eyebrow">YOUR STUDY PLAN</div><h3 style="margin-top:10px">Chủ đề: ${esc(l.vi)}</h3><p>Đọc công thức, xem ví dụ, tự làm bài, đọc giải thích và ôn lại câu sai.</p>${badge(l.level)}<div style="margin-top:16px">${fillbar(l.questions.filter(q=>store.attempts.some(a=>a.id===q.id&&a.correct)).length,l.questions.length)}<div class="tiny" style="margin-top:8px">${l.questions.filter(q=>store.attempts.some(a=>a.id===q.id&&a.correct)).length}/${l.questions.length} câu từng làm đúng</div></div></div></aside></div>`;}
const types=[['all','Tất cả dạng'],['mcq','Trắc nghiệm'],['fill','Điền từ'],['order','Sắp xếp câu'],['correct','Sửa lỗi']];
function practice(){return `<div class="section-head" style="margin-top:0"><div><div class="eyebrow">PRACTICE STUDIO</div><h2>Luyện tập thông minh</h2><p>Chọn trình độ, chủ đề và dạng câu hỏi. Các câu được xáo trộn khi bắt đầu.</p></div></div><div class="grid2"><article class="panel"><h2 style="margin-top:0">Thiết lập bài luyện</h2><label class="question-input-label" for="practice-level">Trình độ</label><select id="practice-level" class="select" style="width:100%;margin-bottom:16px"><option value="all">Tất cả A1–B1</option>${['A1','A2','B1'].map(l=>`<option ${state.practiceLevel===l?'selected':''}>${l}</option>`).join('')}</select><label class="question-input-label" for="practice-topic">Chủ đề</label><select id="practice-topic" class="select" style="width:100%;margin-bottom:16px"><option value="all">Tất cả chủ đề</option>${LESSONS.filter(l=>state.practiceLevel==='all'||l.level===state.practiceLevel).map(l=>`<option value="${l.id}" ${state.practiceTopic===l.id?'selected':''}>${l.level} · ${esc(l.title)}</option>`).join('')}</select><label class="question-input-label" for="practice-type">Dạng bài tập</label><select id="practice-type" class="select" style="width:100%;margin-bottom:22px">${types.map(([v,txt])=>`<option value="${v}" ${state.practiceType===v?'selected':''}>${txt}</option>`).join('')}</select><button class="btn" data-start-practice> Bắt đầu 12 câu → </button><p class="tiny">Nếu chủ đề có ít hơn 12 câu phù hợp, hệ thống sẽ lấy toàn bộ câu có sẵn.</p></article><aside class="panel"><div class="feature-icon pink">✦</div><h2>4 dạng thực hành</h2><ul class="info-list"><li>Multiple choice — chọn đáp án.</li><li>Fill the gap — điền từ còn thiếu.</li><li>Word order — xếp từ thành câu.</li><li>Error correction — viết lại câu sai.</li></ul><div class="note">Hệ thống dùng ngân hàng đã biên soạn. Không gọi AI trực tiếp, không mất phí theo lượt.</div></aside></div>`;}
function exam(){return `<div class="section-head" style="margin-top:0"><div><div class="eyebrow">EXAM MODE</div><h2>Kiểm tra tổng hợp</h2><p>20 câu trộn ngẫu nhiên, không hiện giải thích cho đến khi hoàn thành.</p></div></div><div class="grid2"><article class="panel"><div class="feature-icon gold">◷</div><h2>Đề luyện chuẩn hóa</h2><p>Đề gồm nhiều dạng câu hỏi, có cả câu hỏi về kiến thức A1, A2 và B1.</p><label class="question-input-label" for="exam-level">Lựa chọn trình độ</label><select id="exam-level" class="select" style="width:100%;margin-bottom:20px"><option value="all">Tổng hợp A1–B1</option>${['A1','A2','B1'].map(l=>`<option ${state.examLevel===l?'selected':''}>${l}</option>`).join('')}</select><button class="btn" data-start-exam>Bắt đầu kiểm tra 20 câu →</button></article><article class="panel"><h2 style="margin-top:0">Nguyên tắc</h2><ul class="info-list"><li>Mỗi câu đúng được 1 điểm.</li><li>Một bài kiểm tra gồm 20 câu từ ngân hàng hiện có.</li><li>Không cho đổi đáp án sau khi gửi.</li><li>Hiện đáp án, giải thích và điểm tổng khi kết thúc.</li><li>Kết quả lưu cục bộ, không truyền lên máy chủ.</li></ul><div class="note warn">Bài kiểm tra luyện tập, không phải chứng chỉ CEFR chính thức.</div></article></div>`;}
function mistakes(){let qs=store.wrongIds.map(id=>QBY_ID[id]).filter(Boolean);return `<div class="section-head" style="margin-top:0"><div><div class="eyebrow">SMART REVIEW</div><h2>Ôn lại câu từng làm sai</h2><p>Các câu sai được đưa vào danh sách ôn. Làm đúng sẽ được loại khỏi danh sách.</p></div></div><div class="panel"><div class="count-row"><div><h2 style="margin:0">${qs.length} câu cần luyện lại</h2><p class="tiny">Không có tài khoản và không lưu trên máy chủ.</p></div><button class="btn" data-start-review ${qs.length?'':'disabled'}>Ôn ngay →</button></div><hr class="separator">${qs.length?`<div class="lesson-list">${qs.slice(0,24).map(q=>`<button data-start-one="${q.id}"><span><b>${esc(BY_ID[q.topic].title)}</b><br><span class="tiny">${esc(q.question)}</span></span><span class="tag">${{mcq:'Trắc nghiệm',fill:'Điền từ',order:'Xếp câu',correct:'Sửa lỗi'}[q.type]}</span></button>`).join('')}</div>`:'<div class="empty"><div style="font-size:37px;margin-bottom:9px">✓</div>Chưa có câu sai cần ôn. Bạn có thể bắt đầu bài luyện mới.</div>'}</div>`;}
function progress(){let s=stats();let levelStats=['A1','A2','B1'].map(l=>{let qq=QUESTIONS.filter(q=>q.level===l),aa=store.attempts.filter(a=>QBY_ID[a.id]?.level===l);return{l,total:qq.length,attempts:aa.length,right:aa.filter(a=>a.correct).length,unique:new Set(aa.map(a=>a.id)).size}});return `<div class="section-head" style="margin-top:0"><div><div class="eyebrow">LEARNING ANALYTICS</div><h2>Tiến độ học tập</h2><p>Báo cáo chỉ lưu trên thiết bị này, có thể xuất ra tệp JSON.</p></div></div><div class="metrics"><div class="metric"><div class="metric-icon">✎</div><b>${s.total}</b><small>Lượt trả lời</small></div><div class="metric"><div class="metric-icon">✓</div><b>${s.acc}%</b><small>Độ chính xác</small></div><div class="metric"><div class="metric-icon">▤</div><b>${s.read}</b><small>Bài đã đánh dấu</small></div><div class="metric"><div class="metric-icon">↺</div><b>${s.wrong}</b><small>Câu đang cần ôn</small></div></div><div class="grid2"><section class="panel"><h2 style="margin-top:0">Tiến độ theo trình độ</h2><div class="stat-bars">${levelStats.map(x=>`<div><div class="stat-line"><span><b>${x.l}</b> · ${x.unique}/${x.total} câu đã thử</span><span>${x.attempts?Math.round(x.right/x.attempts*100):0}% đúng</span></div>${fillbar(x.unique,x.total)}</div>`).join('')}</div><hr class="separator"><p class="tiny">Tỷ lệ tính trên tất cả lượt làm; làm lại câu có thể thay đổi tỷ lệ.</p></section><section class="panel"><h2 style="margin-top:0">Lượt luyện tập gần đây</h2>${store.attempts.length?`<div style="overflow:auto"><table class="table"><thead><tr><th>Ngày</th><th>Chủ đề</th><th>Kết quả</th></tr></thead><tbody>${store.attempts.slice(-9).reverse().map(a=>`<tr><td>${formatDay(a.at)}</td><td>${esc(BY_ID[QBY_ID[a.id]?.topic]?.title||'-')}</td><td style="color:${a.correct?'var(--good)':'var(--bad)'}">${a.correct?'Đúng':'Sai'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Hãy hoàn thành bài tập đầu tiên để có kết quả.</div>'}</section></div><div class="section-head"><div><h2>Quản lý dữ liệu của bạn</h2><p>Tiến độ không đồng bộ giữa các thiết bị. Nếu xóa dữ liệu trình duyệt, lịch sử có thể mất.</p></div></div><div class="actions"><button class="btn secondary" data-export>↓ Xuất kết quả JSON</button><button class="btn secondary" data-reset>↺ Xóa tiến độ trên máy này</button></div>`;}
function teacher(){let prompts=[['01. Thiết kế bài học','Act as an English teacher for adult learners. Draft an A2 lesson about Present Simple with a short rule, two bilingual examples, a common mistake, and 4 practice questions.'],['02. Tạo bài tập đa dạng','Create A1–B1 English grammar tasks: multiple choice, gap-fill, word order, and error correction. Provide one clearly defensible answer and a short Vietnamese explanation for each.'],['03. Kiểm duyệt đầu ra','Review the following English grammar tasks. Flag ambiguous wording, more than one valid option, tense inconsistency, spelling problems, and explanations that are too difficult for the target CEFR level.'],['04. Thiết kế phản hồi học tập','For a learner who answered grammar questions incorrectly, explain the rule in simple Vietnamese, show a corrected English sentence, and suggest a short follow-up exercise without inferring their ability beyond these answers.']];return `<div class="section-head" style="margin-top:0"><div><div class="eyebrow">TRANSPARENT TEACHING WORKFLOW</div><h2>Teacher View — AI hỗ trợ thế nào?</h2><p>Dùng để trình bày với cô Oanh: quy trình và giới hạn thực tế của ứng dụng.</p></div></div><div class="grid3">${[['01','AI hỗ trợ soạn','Đề xuất bài học và bài tập theo mục tiêu CEFR.'],['02','Giáo viên kiểm tra','Sửa câu mơ hồ, kiểm tra đáp án, bảo đảm mức độ.'],['03','Website chấm bài','JavaScript so sánh đáp án đã duyệt và tạo phản hồi.']].map(([n,t,d])=>`<div class="card"><div class="step-dot">${n}</div><h3 style="margin-top:13px">${t}</h3><p>${d}</p></div>`).join('')}</div><div class="panel" style="margin-top:20px"><h2 style="margin-top:0">Prompt mẫu có thể tái sử dụng</h2><p>Đây là các prompt minh họa quy trình có thể tái tạo, không được trình bày như ảnh chụp một phiên ChatGPT thực tế.</p>${prompts.map(([t,p])=>`<div class="teacher-prompt"><strong>${esc(t)}</strong><div style="margin-top:10px"><code>${esc(p)}</code></div><button class="btn small secondary" style="margin-top:10px" data-copy="${esc(p)}">Sao chép prompt</button></div>`).join('')}<div class="note warn">Lưu ý: Không có mô hình AI đang suy luận/chấm bài trực tiếp trên website. Mọi câu hỏi, đáp án và lời giải hiện chạy từ ngân hàng nội dung tĩnh; kết quả lưu bằng localStorage trong trình duyệt.</div></div>`;}
function about(){return `<div class="section-head" style="margin-top:0"><div><div class="eyebrow">ABOUT THE PROJECT</div><h2>Grammar AI Lab 3.0</h2><p>Ứng dụng hỗ trợ học ngữ pháp tiếng Anh do Group 2 thực hiện cho lớp 25BAV8.</p></div></div><div class="grid2"><div class="panel"><h2 style="margin-top:0">Mục tiêu</h2><p>Minh họa việc sử dụng AI hỗ trợ giáo viên thiết kế học liệu ngữ pháp và một môi trường luyện tập tương tác cho người lớn học tiếng Anh.</p><h2>Nguồn tham khảo</h2><ul class="info-list"><li><b>Grammar_20 – SV:</b> đề cương và các câu mẫu cô Oanh cung cấp.</li><li><b>GRAMMAR_Review:</b> các thì, hòa hợp chủ ngữ–động từ, gerund/infinitive, modal verbs và nhiều chủ đề ngữ pháp.</li><li><b>Bài tập mở rộng:</b> câu hỏi, ví dụ và lời giải được biên soạn bổ sung cho website; không phải bản sao nguyên văn đáp án của cô Oanh.</li></ul></div><div class="panel"><h2 style="margin-top:0">Thông tin nhóm</h2><p><b>Long An University of Economics and Industry</b><br>Class 25BAV8 · Group 2</p><ul class="info-list">${['NGUYEN TIEN DUNG','TRA THI THANH THAO','TO TUAN KHANG','NGUYEN THI LIEN HUONG','PHAM NGUYEN HUYEN TRAN'].map(n=>`<li>${n}</li>`).join('')}</ul><div class="note">Hoạt động ngoại tuyến sau khi mở tệp HTML. Không yêu cầu đăng nhập, không cần API trả phí, không gửi kết quả học viên lên máy chủ.</div></div></div>`;}
const shuffle=a=>{let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
function start(kind,questions){const qq=shuffle(questions);if(!qq.length){alert('Không có câu hỏi phù hợp.');return}state.session={kind,ids:qq.map(q=>q.id),index:0,log:[],started:Date.now()};state.choice=null;state.ordered=[];state.entry='';state.checked=false;state.result=null;navigate('session')}
function current(){return QBY_ID[state.session?.ids[state.session.index]]}
function session(){let s=state.session;if(!s)return home();const q=current(),l=BY_ID[q.topic],isExam=s.kind==='exam',completed=s.index;let slot='';if(q.type==='mcq'){slot=`<div class="answer-options">${q.options.map((o,i)=>`<button class="answer ${state.choice===i?'chosen':''} ${state.checked&&i===q.correct?'right':''} ${state.checked&&i===state.choice&&i!==q.correct?'wrong':''}" data-choice="${i}" ${state.checked?'disabled':''}><code>${String.fromCharCode(65+i)}</code><span>${esc(o)}</span></button>`).join('')}</div>`}else if(q.type==='fill'||q.type==='correct'){slot=`<label class="question-input-label" for="answer-field">${q.type==='fill'?'Điền phần còn thiếu (tiếng Anh)':'Viết lại cả câu cho đúng (tiếng Anh)'}</label><input autocomplete="off" spellcheck="false" class="input-answer" id="answer-field" value="${esc(state.entry)}" placeholder="Nhập câu trả lời..." ${state.checked?'disabled':''}/>`}else if(q.type==='order'){let sels=state.ordered;slot=`<label class="question-input-label">Chọn các từ theo thứ tự đúng</label><div class="sentence-area" aria-label="Câu đang xếp">${sels.length?sels.map((v,i)=>`<button class="word" data-remove-word="${i}" ${state.checked?'disabled':''}>${esc(q.words[v])}</button>`).join(''):'<span class="tiny">Chọn các ô từ ở dưới...</span>'}</div><div class="wordbank">${q.words.map((w,i)=>`<button class="word" data-add-word="${i}" ${sels.includes(i)||state.checked?'disabled':''}>${esc(w)}</button>`).join('')}</div>`}let feedback=state.checked&&!isExam?`<div class="feedback ${state.result?'':'error'}"><b>${state.result?'✓ Chính xác':'✕ Chưa đúng'}</b><span class="correct">Đáp án: ${esc(q.type==='mcq'?q.options[q.correct]:q.correct)}</span><div>${esc(q.explain)}</div></div>`:'';return `<div class="section-head" style="margin-top:0"><div><div class="eyebrow">${isExam?'MOCK TEST':s.kind==='review'?'ERROR REVIEW':s.kind==='lesson'?'LESSON PRACTICE':'GRAMMAR PRACTICE'}</div><h2>${esc(l.title)}</h2><p>${isExam?'Giải thích xuất hiện ở cuối bài kiểm tra.':'Chọn câu trả lời rồi xem phản hồi và giải thích.'}</p></div><span>${badge(l.level)}</span></div><div class="panel"><div class="question-top"><div class="question-label">CÂU ${completed+1} / ${s.ids.length}</div><span class="tag">${{mcq:'Multiple Choice',fill:'Fill in the Gap',correct:'Correct the Mistake',order:'Word Order'}[q.type]}</span></div><div style="margin-top:12px">${fillbar(completed,s.ids.length)}</div><h2 class="question-title">${esc(q.question)}</h2>${slot}${feedback}<hr class="separator"><div class="count-row"><button class="btn secondary" data-end-session>Kết thúc</button>${state.checked?`<button class="btn" data-next-question>${completed===s.ids.length-1?'Xem kết quả →':'Câu tiếp theo →'}</button>`:`<button class="btn" data-submit-answer ${!ready(q)?'disabled':''}>${isExam?'Lưu đáp án →':'Kiểm tra đáp án ✓'}</button>`}</div>${isExam?'<p class="tiny">Bài kiểm tra sẽ không hiển thị đáp án cho đến phần kết quả.</p>':''}</div>`;}
function ready(q){if(!q)return false;if(q.type==='mcq')return state.choice!==null;if(q.type==='fill'||q.type==='correct')return state.entry.trim().length>0;return state.ordered.length===q.words.length}
function answerIsCorrect(q){if(q.type==='mcq')return state.choice===q.correct;if(q.type==='order')return normalize(state.ordered.map(i=>q.words[i]).join(' '))===normalize(q.correct);return normalize(state.entry)===normalize(q.correct)}
function submit(){if(state.checked||!state.session)return;let q=current();if(!ready(q))return;let ok=answerIsCorrect(q);state.result=ok;state.checked=true;state.session.log.push({id:q.id,correct:ok,response:q.type==='mcq'?q.options[state.choice]:q.type==='order'?state.ordered.map(i=>q.words[i]).join(' '):state.entry});store.attempts.push({id:q.id,correct:ok,at:Date.now()});if(ok)store.wrongIds=store.wrongIds.filter(id=>id!==q.id);else if(!store.wrongIds.includes(q.id))store.wrongIds.push(q.id);save();render()}
function next(){if(!state.session)return;if(state.session.index+1===state.session.ids.length){store.examRuns+=state.session.kind==='exam'?1:0;save();navigate('summary');return}state.session.index++;state.choice=null;state.ordered=[];state.entry='';state.checked=false;state.result=null;render()}
function finish(){if(!state.session)return;navigate('summary')}
function summary(){let s=state.session;if(!s)return home();let points=s.log.filter(x=>x.correct).length,tot=s.log.length,isExam=s.kind==='exam',pct=tot?Math.round(points/tot*100):0;return `<div class="panel"><div class="eyebrow">${isExam?'MOCK EXAM RESULT':'PRACTICE REPORT'}</div><h1>${tot?`Bạn đạt ${points}/${tot} câu`:'Chưa có câu trả lời'}</h1><p>${tot?`Độ chính xác của lượt này: ${pct}%. Đọc phần giải thích bên dưới để củng cố kiến thức.`:'Hãy thử một bài học hoặc bài luyện khác.'}</p>${fillbar(points,Math.max(1,tot))}<div class="actions" style="margin:22px 0 5px"><button class="btn" data-nav="mistakes">Ôn câu sai →</button><button class="btn secondary" data-nav="practice">Luyện bài khác</button><button class="btn secondary" data-nav="progress">Xem tiến độ</button></div></div>${tot?`<div class="section-head"><h2>Đáp án và giải thích</h2></div><div class="lesson-list">${s.log.map((a,i)=>{let q=QBY_ID[a.id];return `<div class="card"><div class="count-row"><b>Câu ${i+1}: ${esc(BY_ID[q.topic].title)}</b><span style="color:${a.correct?'var(--good)':'var(--bad)'};font-weight:800">${a.correct?'✓ Đúng':'✕ Sai'}</span></div><p style="color:var(--ink);margin:10px 0">${esc(q.question)}</p><div class="tiny">Bạn trả lời: ${esc(a.response)}</div><div style="font-weight:800;color:var(--ink);margin-top:6px">Đáp án: ${esc(q.type==='mcq'?q.options[q.correct]:q.correct)}</div><div class="tiny">${esc(q.explain)}</div></div>`}).join('')}</div>`:''}`;}
function dialogReset(){document.querySelector('#dialog-root').innerHTML=`<div class="modal-shade"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><h2 id="dialog-title">Xóa tiến độ học tập?</h2><p>Tất cả kết quả, câu sai và bài đã đánh dấu sẽ bị xóa trên thiết bị này. Thao tác không hoàn tác được.</p><div class="actions"><button class="btn secondary" data-close-dialog>Hủy</button><button class="btn" data-confirm-reset>Xóa tiến độ</button></div></div></div>`;}
function exportData(){const data=JSON.stringify({app:'Grammar AI Lab Group 2',version:'3.0',date:new Date().toISOString(),...store},null,2);let blob=new Blob([data],{type:'application/json;charset=utf-8'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='grammar-ai-lab-tien-do.json';a.click();URL.revokeObjectURL(u)}
function speak(text){if(!('speechSynthesis' in window)){alert('Trình duyệt này không hỗ trợ phát âm.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.85;speechSynthesis.speak(u)}
app.addEventListener('click',async ev=>{let btn=ev.target.closest('button');if(!btn)return;if(btn.dataset.nav){navigate(btn.dataset.nav);scrollTop()}else if(btn.dataset.openLesson){navigate('lesson',btn.dataset.openLesson);scrollTop()}else if(btn.dataset.filterLevel){state.level=btn.dataset.filterLevel;navigate('lessons');scrollTop()}else if(btn.dataset.markRead){let id=btn.dataset.markRead;store.readLessons=store.readLessons.includes(id)?store.readLessons.filter(x=>x!==id):[...store.readLessons,id];save();render()}else if(btn.dataset.startLesson){start('lesson',BY_ID[btn.dataset.startLesson].questions)}else if(btn.hasAttribute('data-start-practice')){let l=state.practiceLevel,t=state.practiceTopic,k=state.practiceType;let arr=QUESTIONS.filter(q=>(l==='all'||q.level===l)&&(t==='all'||q.topic===t)&&(k==='all'||q.type===k));start('practice',shuffle(arr).slice(0,12))}else if(btn.hasAttribute('data-start-exam')){let arr=QUESTIONS.filter(q=>state.examLevel==='all'||q.level===state.examLevel);start('exam',shuffle(arr).slice(0,20))}else if(btn.hasAttribute('data-start-review')){start('review',store.wrongIds.map(id=>QBY_ID[id]).filter(Boolean).slice(0,20))}else if(btn.dataset.startOne){start('review',[QBY_ID[btn.dataset.startOne]])}else if(btn.dataset.choice!==undefined){if(!state.checked){state.choice=Number(btn.dataset.choice);render()}}else if(btn.dataset.addWord!==undefined){if(!state.checked){state.ordered.push(Number(btn.dataset.addWord));render()}}else if(btn.dataset.removeWord!==undefined){if(!state.checked){state.ordered.splice(Number(btn.dataset.removeWord),1);render()}}else if(btn.hasAttribute('data-submit-answer')){submit()}else if(btn.hasAttribute('data-next-question')){next()}else if(btn.hasAttribute('data-end-session')){finish()}else if(btn.hasAttribute('data-export')){exportData()}else if(btn.hasAttribute('data-reset')){dialogReset()}else if(btn.hasAttribute('data-close-dialog')){document.querySelector('#dialog-root').innerHTML=''}else if(btn.hasAttribute('data-confirm-reset')){store=structuredClone(DEFAULT);save();document.querySelector('#dialog-root').innerHTML='';navigate('progress')}else if(btn.dataset.speak){speak(btn.dataset.speak)}else if(btn.dataset.copy){try{await navigator.clipboard.writeText(btn.dataset.copy);btn.textContent='Đã sao chép ✓'}catch{btn.textContent='Không thể sao chép (hãy chọn văn bản)'}}});
app.addEventListener('input',e=>{if(e.target.id==='search-lessons'){let pos=e.target.selectionStart;state.search=e.target.value;render();let field=document.querySelector('#search-lessons');field.focus();field.setSelectionRange(pos,pos)}else if(e.target.id==='answer-field'){state.entry=e.target.value;let b=app.querySelector('[data-submit-answer]');if(b)b.disabled=!ready(current())}});
app.addEventListener('change',e=>{if(e.target.id==='filter-lessons'){state.level=e.target.value;render()}else if(e.target.id==='practice-level'){state.practiceLevel=e.target.value;state.practiceTopic='all';render()}else if(e.target.id==='practice-topic'){state.practiceTopic=e.target.value;render()}else if(e.target.id==='practice-type'){state.practiceType=e.target.value;render()}else if(e.target.id==='exam-level'){state.examLevel=e.target.value;render()}});
document.querySelectorAll('[data-route]').forEach(b=>b.addEventListener('click',()=>{navigate(b.dataset.route);scrollTop()}));
document.querySelector('#navtoggle').addEventListener('click',()=>document.querySelector('#sidebar').classList.toggle('open'));
document.querySelector('#theme-toggle').addEventListener('click',()=>{store.theme=store.theme==='dark'?'light':'dark';save();render()});
window.addEventListener('hashchange',()=>{render();scrollTop()});
window.addEventListener('keydown',e=>{if(e.key==='Enter'&&state.route==='session'&&!state.checked&&e.target.id==='answer-field')submit()});
render();
</script>
</body></html>
