<body><main><h1>Vua Bàn Nhậu</h1><p id="g17-status" role="status" aria-live="polite">Đang xác minh bản ứng dụng…</p><button id="g17-recover" type="button" hidden>Chuyển sang bản dự phòng đã xác minh</button><button id="g17-retry" type="button" hidden>Thử lại</button></main>
<script>
(function () {
  'use strict';
  const REVISION = "5fee2d94af926f47b77223e1aa054dde1a5ebb7bbf7aeee0ca7ecbfa71ac7e55";
  const MANIFEST_SHA = "7aa0af14562517a08da804b8145dbba6759316a2dd03d752f603882ada5ce8b7";
  const BUILD_MODE = "ISOLATED_CANDIDATE";
  const BUILD_LABEL = "ISOLATED CANDIDATE — NOT RELEASE APPROVED";
  const BUILD_IDENTITY_SHA = "3f05d32ba831fc6decf8f919c144cb44590b0c54398d6739876765a9290d9770";
  const SOURCE_LABEL = 'UNFROZEN DEVELOPMENT FIXTURE — NOT RELEASE SOURCE';
  const status = document.getElementById('g17-status');
  const retry = document.getElementById('g17-retry');
  const recover = document.getElementById('g17-recover');
  const recoveryMode = new URL(location.href).searchParams.get('g17') === 'recover';
  function hex(buffer) { return Array.from(new Uint8Array(buffer), x => x.toString(16).padStart(2, '0')).join(''); }
  async function bounded(promise, ms, label) {
    let timer;
    try { return await Promise.race([promise, new Promise((_, reject) => { timer = setTimeout(() => reject(new Error(label || 'timeout')), ms); })]); }
    finally { clearTimeout(timer); }
  }
  function ask(worker, data) {
    return bounded(new Promise((resolve, reject) => {
      const channel = new MessageChannel();
      const timer = setTimeout(() => { channel.port1.close(); reject(new Error('worker protocol timeout')); }, 2500);
      channel.port1.onmessage = event => { clearTimeout(timer); channel.port1.close(); resolve(event.data); };
      try { worker.postMessage(data, [channel.port2]); }
      catch (error) { clearTimeout(timer); channel.port1.close(); reject(error); }
    }), 3000, 'worker protocol timeout');
  }
  function identityPayload(sourceWitness) {
    return { schema: 1, mode: BUILD_MODE, label: BUILD_LABEL, sourceWitness, releaseApproved: false };
  }
  async function verifyManifest() {
    const response = await bounded(fetch('/m/' + REVISION + '.json', { cache: 'no-store' }), 8000, 'manifest timeout');
    if (!response.ok || response.headers.get('content-type')?.split(';')[0].trim() !== 'application/json') throw new Error('manifest unavailable or wrong MIME');
    const bytes = await response.arrayBuffer();
    if (hex(await crypto.subtle.digest('SHA-256', bytes)) !== MANIFEST_SHA) throw new Error('manifest hash mismatch');
    const manifest = JSON.parse(new TextDecoder().decode(bytes));
    if (manifest.schema !== 1 || manifest.revision !== REVISION || manifest.sourceStatus !== SOURCE_LABEL ||
        manifest.buildMode !== BUILD_MODE || manifest.buildIdentitySha256 !== BUILD_IDENTITY_SHA ||
        manifest.buildIdentity?.schema !== 1 || manifest.buildIdentity?.mode !== BUILD_MODE ||
        manifest.buildIdentity?.label !== BUILD_LABEL || manifest.buildIdentity?.sourceWitness !== manifest.sourceWitness ||
        manifest.buildIdentity?.releaseApproved !== false || manifest.buildIdentity?.sha256 !== BUILD_IDENTITY_SHA ||
        !/^[0-9a-f]{64}$/.test(manifest.sourceWitness || '') || manifest.releaseApproved !== false) throw new Error('manifest build identity mismatch');
    const identityBytes = new TextEncoder().encode(JSON.stringify(identityPayload(manifest.sourceWitness)) + '\n');
    if (hex(await crypto.subtle.digest('SHA-256', identityBytes)) !== BUILD_IDENTITY_SHA) throw new Error('build identity witness mismatch');
    return manifest;
  }
  function matches(reply, expectedStatus) {
    return reply?.schema === 1 && reply.status === expectedStatus && reply.revision === REVISION &&
      reply.manifestSha256 === MANIFEST_SHA && reply.buildMode === BUILD_MODE &&
      reply.buildIdentitySha256 === BUILD_IDENTITY_SHA;
  }
  function hasIdentityEnvelope(reply) {
    return reply?.schema === 1 && /^[0-9a-f]{64}$/.test(reply.revision || '') &&
      /^[0-9a-f]{64}$/.test(reply.manifestSha256 || '') &&
      ['DEVELOPMENT_FIXTURE', 'ISOLATED_CANDIDATE'].includes(reply.buildMode) &&
      /^[0-9a-f]{64}$/.test(reply.buildIdentitySha256 || '') && ['ACTIVE', 'WAITING'].includes(reply.status);
  }
  function waitingState(message) {
    status.textContent = message;
    status.dataset.state = 'WAITING';
    retry.hidden = false;
  }
  function blockedState(state, message) {
    status.textContent = message;
    status.dataset.state = state;
    retry.hidden = false;
  }
  async function waitForController(ms) {
    if (navigator.serviceWorker.controller) return navigator.serviceWorker.controller;
    await bounded(new Promise(resolve => navigator.serviceWorker.addEventListener('controllerchange', resolve, { once: true })), ms, 'controller unavailable');
    return navigator.serviceWorker.controller;
  }
  async function waitForInstall(registration) {
    let worker = registration.installing;
    if (!worker) return;
    await bounded(new Promise((resolve, reject) => {
      const changed = () => {
        if (worker.state === 'installed' || worker.state === 'activated' || worker.state === 'redundant') {
          worker.removeEventListener('statechange', changed);
          resolve();
        }
      };
      worker.addEventListener('statechange', changed);
      changed();
    }), 12000, 'worker install timeout');
  }
  async function run() {
    retry.hidden = true;
    recover.hidden = true;
    status.dataset.state = 'VERIFYING';
    status.textContent = 'Đang xác minh bản ứng dụng…';
    try {
      if (!navigator.serviceWorker || !crypto.subtle) throw new Error('secure browser features unavailable');
      const manifest = await verifyManifest();
      const registration = await bounded(navigator.serviceWorker.register('/sw.js', { scope: '/' }), 10000, 'registration timeout');
      try { await bounded(registration.update(), 10000, 'update check timeout'); }
      catch (_) { /* An already-active exact witness may remain usable offline. */ }
      await waitForInstall(registration);

      const waiting = registration.waiting;
      if (waiting) {
        let proposed;
        try { proposed = await ask(waiting, { g17: 'identity' }); }
        catch (_) { blockedState('UNKNOWN_WAITING_WORKER', 'Có worker đang chờ nhưng không xác minh được danh tính. Không tải trò chơi; hãy đóng các tab cũ rồi thử lại.'); return; }
        const stillWaiting = matches(proposed, 'WAITING');
        if (!stillWaiting && !matches(proposed, 'ACTIVE')) {
          if (hasIdentityEnvelope(proposed)) {
            waitingState('Có worker cập nhật đang chờ nhưng tab này chưa có witness để xác minh revision đó. Không tải nội dung mới; hãy đóng các tab cũ và mở lại sau khi trình duyệt hoàn tất vòng đời worker.');
            status.dataset.controller = 'other-revision-not-attested';
          } else {
            blockedState('UNTRUSTED_WAITING_WORKER', 'Worker đang chờ không cung cấp danh tính hợp lệ. Không tải trò chơi.');
          }
          return;
        }
        if (stillWaiting) {
          const controller = navigator.serviceWorker.controller;
          if (controller) {
            let active = null;
            try { active = await ask(controller, { g17: 'identity' }); } catch (_) { /* legacy/unknown controller */ }
            if (!matches(active, 'ACTIVE')) {
              waitingState('Bản ứng dụng đã xác minh đang chờ. Worker cũ hoặc chưa rõ danh tính vẫn điều khiển tab; hãy đóng tất cả tab Vua Bàn Nhậu rồi mở lại. Không tự chuyển phiên bản.');
              status.dataset.controller = active?.schema === 1 ? 'other-verified-revision' : 'legacy-or-unknown';
              return;
            }
          } else {
            waitingState('Bản đã xác minh đang chờ kích hoạt. Hãy đóng tab ứng dụng khác rồi mở lại; candidate không tự chiếm quyền điều khiển.');
            status.dataset.controller = 'none';
            return;
          }
        }
      }

      let controller = navigator.serviceWorker.controller;
      if (!controller) controller = await waitForController(12000);
      if (!controller) {
        const latest = await bounded(navigator.serviceWorker.getRegistration('/'), 3000, 'registration lookup timeout');
        if (latest?.waiting) waitingState('Candidate đang chờ browser lifecycle. Đóng tab ứng dụng khác rồi mở lại; không có forced activation.');
        else blockedState('NO_CONTROLLER', 'Chưa có worker điều khiển tab. Không tải trò chơi; thử lại sau khi kết nối ổn định.');
        return;
      }
      let active;
      try { active = await ask(controller, { g17: 'identity' }); }
      catch (_) {
        blockedState('LEGACY_OR_UNKNOWN_CONTROLLER', 'Worker hiện tại không cung cấp danh tính G17 hợp lệ. Không tải trò chơi. Hãy đóng các tab ứng dụng cũ rồi mở lại; nếu trạng thái còn lặp lại, cần phương án chuyển tiếp được duyệt riêng.');
        return;
      }
      if (!matches(active, 'ACTIVE')) {
        if (active?.schema === 1 && /^[0-9a-f]{64}$/.test(active.revision || '')) {
          blockedState('OTHER_VERIFIED_REVISION', 'Một revision G17 khác đang hoạt động. Không tự chuyển hoặc reload để tránh trộn tài nguyên.');
        } else {
          blockedState('LEGACY_OR_UNKNOWN_CONTROLLER', 'Worker hiện tại không được xác minh. Không tải trò chơi và không thay đổi dữ liệu.');
        }
        return;
      }
      if (recoveryMode) {
        const witness = await ask(controller, { g17: 'verify-recovery' });
        if (witness?.status !== 'VERIFIED_RECOVERY' || !/^[0-9a-f]{64}$/.test(witness.revision || '') || !/^[0-9a-f]{64}$/.test(witness.manifestSha256 || '')) throw new Error('verified previous revision unavailable');
        status.textContent = 'Bản hiện tại cần kiểm tra. Bản dự phòng đã xác minh sẵn sàng; chỉ chuyển khi bạn chọn.';
        status.dataset.state = 'RECOVERY_READY';
        recover.hidden = false;
        recover.onclick = async () => {
          const fresh = await ask(navigator.serviceWorker.controller, { g17: 'verify-recovery', revision: witness.revision });
          if (fresh?.status !== 'VERIFIED_RECOVERY' || fresh.revision !== witness.revision || fresh.manifestSha256 !== witness.manifestSha256) { status.textContent = 'Bản dự phòng không còn hợp lệ.'; recover.hidden = true; return; }
          sessionStorage.setItem('g17-verified:' + fresh.revision, fresh.manifestSha256);
          sessionStorage.setItem('g17-build-mode:' + fresh.revision, fresh.buildMode);
          sessionStorage.setItem('g17-build-identity:' + fresh.revision, fresh.buildIdentitySha256);
          sessionStorage.setItem('g17-recovery:' + fresh.revision, fresh.manifestSha256);
          location.assign('/r/' + fresh.revision + '/index.html');
        };
        return;
      }
      sessionStorage.setItem('g17-verified:' + REVISION, MANIFEST_SHA);
      sessionStorage.setItem('g17-build-mode:' + REVISION, BUILD_MODE);
      sessionStorage.setItem('g17-build-identity:' + REVISION, BUILD_IDENTITY_SHA);
      location.replace('/r/' + REVISION + '/index.html');
    } catch (error) {
      blockedState('BLOCKED', 'Không thể xác minh candidate. Giữ nguyên dữ liệu; kiểm tra kết nối hoặc đóng tab cũ rồi thử lại.');
      status.dataset.error = String(error.message || error);
    }
  }
  retry.addEventListener('click', run);
  run();
}());
</script></body></html>
